import { notFound } from "next/navigation";
import { getTopicBySlug, topics } from "@/lib/content";

export function generateStaticParams() {
  return topics.map((t) => ({ slug: t.slug }));
}

export default async function TopicPage({
  params,
}: {
  params: Promise<{ slug: string }>;
}) {
  const { slug } = await params;
  const topic = getTopicBySlug(slug);
  if (!topic) return notFound();

  return (
    <main className="mx-auto max-w-md px-5 py-8">
      <div className="mb-1 text-sm text-[var(--ink-soft)]">{topic.bodyPart}</div>
      <h1 className="font-serif-display text-3xl leading-tight">{topic.title}</h1>

      <div className="mt-6 flex flex-col gap-5">
        {topic.sections.map((s) => (
          <section key={s.heading}>
            <h2 className="mb-1 font-medium">{s.heading}</h2>
            <p className="text-[15px] leading-relaxed text-[var(--ink-soft)]">{s.text}</p>
          </section>
        ))}
      </div>

      <div className="mt-8 rounded-lg border border-[var(--caution)] bg-[var(--caution-soft)] px-4 py-4">
        <h2 className="mb-2 font-medium text-[var(--caution)]">
          Ihned vyhledejte péči, pokud:
        </h2>
        <ul className="list-inside list-disc text-[15px] leading-relaxed text-[var(--ink)]">
          {topic.warningSigns.map((w) => (
            <li key={w}>{w}</li>
          ))}
        </ul>
      </div>

      <p className="mt-6 text-xs text-[var(--ink-soft)]">
        Tato stránka poskytuje pouze obecné informace a nenahrazuje osobní
        lékařské vyšetření. Pokud se cokoli neshoduje s tím, co vám bylo
        řečeno osobně, řiďte se pokyny svého lékaře a s dotazy se obraťte na
        ordinaci.
      </p>
    </main>
  );
}
